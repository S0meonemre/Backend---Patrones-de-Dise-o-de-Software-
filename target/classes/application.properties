spring.application.name=serf
spring.profiles.default=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/serf}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
server.port=${PORT:8080}
serf.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Tasas educativas: 1 unidad de origen equivale a esta cantidad de EUR.
serf.config.tasas.CNY=0.13
serf.config.tasas.PEN=0.25
serf.config.tasas.USD=0.92
serf.config.tasas.EUR=1.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**
spring.jackson.default-property-inclusion=non_null
